# Production-like stack: PostgreSQL + the app image. NOT yet verified (remaining task OPS-1).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 3s, retries: 20 }
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      COOKIE_SECURE: "0"
      SEED_DEV: "1"
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
